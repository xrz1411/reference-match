<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参考仿色 LUT · 石墨黑主题预览</title>
  <style>
    :root { color-scheme: dark; --bg: #0d0f12; --surface: #171a1f; --surface-deep: #111318; --line: #363b44; --text: #f2f3f5; --muted: #aeb4be; --accent: #ebc45f; --active: #443516; --inactive: #252a32; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(900px 480px at 55% -15%, #272b33 0%, var(--bg) 60%); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    main { width: min(920px, calc(100vw - 48px)); padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(145deg, rgba(27, 30, 36, .98), rgba(15, 17, 21, .98)); box-shadow: 0 24px 80px rgba(0, 0, 0, .32); }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .12em; } h1 { margin: 4px 0 20px; font-size: 23px; } .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } section { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-deep); } h2 { margin: 0 0 14px; font-size: 14px; } p { color: var(--muted); margin: 0; }
    .states { display: flex; gap: 12px; align-items: center; } button { min-width: 126px; min-height: 42px; border: 1px solid var(--line); border-radius: 8px; background: var(--inactive); color: var(--muted); font: inherit; font-weight: 700; } button.active { border-color: var(--accent); background: var(--active); color: #ffe9aa; box-shadow: inset 0 0 0 1px rgba(235, 196, 95, .12); } .switch { position: relative; width: 42px; min-width: 42px; min-height: 22px; height: 22px; padding: 0; border: 0; border-radius: 999px; background: #343a44; } .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #9aa2ae; } .switch.active { background: #d7aa43; } .switch.active::after { left: 23px; background: #fff9e9; } .toggle { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line); } .toggle:first-of-type { border-top: 0; } .generate { width: 100%; margin-top: 18px; border: 0; background: linear-gradient(90deg, #dfb54e, #f5d37d); color: #211a0a; }
  </style>
  <main>
    <span class="eyebrow">THEME PREVIEW</span>
    <h1>中性石墨黑 + 清晰状态对比</h1>
    <div class="row">
      <section>
        <h2>选择状态</h2>
        <div class="states"><button class="active">Rec.709<br><small>已选择</small></button><button>DWG<br><small>未选择</small></button></div>
        <button class="generate">开始匹配</button>
      </section>
      <section>
        <h2>开关状态</h2>
        <div class="toggle"><span>窗口置顶 · 开启</span><button class="switch active" aria-label="开启"></button></div>
        <div class="toggle"><span>肤色保护 · 关闭</span><button class="switch" aria-label="关闭"></button></div>
        <p>开启使用暖金与亮色圆点；关闭使用冷灰与深色轨道。</p>
      </section>
    </div>
  </main>
</html>
